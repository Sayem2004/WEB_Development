<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        table{
            border-collapse: collapse;
        }
        td, th{
            border: 1px solid blue;
            padding: 10px 20px;
        }
    </style>
</head>
<body>

    <main>
        <table>
            <caption>Frinds List</caption>
            <thead>
                <tr>
                    <th>No</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Age</th>
                </tr>

            </thead>

            <tbody>
                <tr>
                    <td>1</td>
                    <td>Sakib</td>
                    <td>Gunda</td>
                    <td>55</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Nayem</td>
                    <td>Foragi</td>
                    <td>25</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Sayem</td>
                    <td>Foragi</td>
                    <td>22</td>
                </tr>
            </tbody>

            <tfoot>
                <td colspan="4">Total Frinds: 10000</td>

            </tfoot>

        </table>
    </main>
 
<section>
    <h2>Table Info</h2>
    <ul>
        <li>Table:table</li>
        <li>Table Head: thead</li>
        <li>Table body: tbody</li>
        <li>Table foot: tfoot</li>
        <li>Table row: tr</li>
        <li>Table data: td</li>
        <li>Table head data: th</li>



    </ul>
</section>
</body>
</html>
