<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading</title>
    <style>
        h3::after{
            content: '.pdf';
            color: rgb(16, 239, 210);
            background-color: rgb(0, 0, 0);
            font-size: 12px;
        }
        h3::before{
            content: 'Start:';
        }
    </style>
</head>
<body>
    <h3>Heading -1</h3>
    <h3>Heading -2</h3>
    <h3>Heading -3</h3>
</body>
</html>
