<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo</title>
    <style>
        h3{
            color: peru;
        }

        h3:hover{
            background-color: skyblue;
            color:tomato
            
        }
        input:focus{
            color: red;
            /* padding-left: 20px; */
            outline: 0px;
            border: 2px solid green;
            
        }
        a:visited{
            color: gold;
        }
        li:last-child{
            color: brown;
            font-weight: bolder;
        }
        li:first-child{
            color: rgb(241, 222, 5);
        }
        li:nth-child(2n){
            color: blue;

        }
    </style>
</head>
<body>

    <input type="text">

</html>
