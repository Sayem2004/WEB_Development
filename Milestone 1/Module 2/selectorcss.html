<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixed Selector</title>
    <style> 
    p{
        color: rgb(255, 9, 5);
     }

     #fifth{
        font-size: 26px;
        background-color: beige;
     }

     .hhh{
        background-color: rgb(15, 240, 248);
        text-align: center;
     }
     .bold{
        font-weight: bolder;
        font-size: 30px;
    
    .header{
        height: 300px;
        
    }
    }
    </style>
</head>
<body>
    <header class="header">Hellow Everyone</header>
    <h1>Explore Mixed Selector</h1>
    <p>First day at University</p>
    <p id="fifth">Second day at University</p>
    <p class="bold">Third day at University</p>
    <p>4th day at University</p>
    <p class="hhh bold">5th day at University</p>
    <p>6th day at University</p>
    
</body>
</html>
