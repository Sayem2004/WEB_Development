<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../Module 1/images.png" type="image/x-icon">
    <title>Mixed Selecctort</title>
    <style>
        p{
            color: blue;
        }
        #th{
            font-size: 50px;
        }
        .tt{
            background-color: yellowgreen;
        }
        .bold,.tt{
            font-weight: 800;
        }
        *{
            margin: 11px;
        }
    </style>
</head>
<body>
    <p>My First line css</p>
    <p class="tt">My second line css</p>
    <p>My third line css</p>
    <p>My 4 line css</p>
    <p id="th">My 5 line css</p>
    <p class="tt">My 6 line css</p>
    <p>My 7 line css</p>

    <ol>
        <li class="bold">Element selector</li>
        <li id="th">ID selector</li>
        <li>Universal selector</li>
    </ol>

    <ul>
        <li class="bold">Element selector</li>
        <li>ID selector</li>
        <li>Universal selector</li>
    </ul>
</body>
</html>
